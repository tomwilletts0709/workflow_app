[project]
name = "NA"
version = "0.1.0"
description = "Websocket_app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.1",
    "redis>=7.4.0",
    "python-multipart>=0.0.29",
    "slowapi>=0.1.9",
    "psycopg2">=
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
